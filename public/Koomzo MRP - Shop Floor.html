<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Koomzo MRP — Atelier</title>
<link rel="icon" type="image/png" href="pos/koomzo-favicon.png" />
<link rel="stylesheet" href="pos/colors_and_type.css" />
<link rel="stylesheet" href="retailflex/rx.css" />
<link rel="stylesheet" href="retailflex/rx-ops.css" />
<link rel="stylesheet" href="inventory/iv.css" />
<link rel="stylesheet" href="mrp/mrp.css" />
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>a{color:var(--kz-primary);text-decoration:none}a:hover{color:var(--kz-primary-shade)}</style>
  <script src="kz/kz-locale.js"></script>
</head>
<body>
<div id="root"></div>
<script src="inventory/iv-data.js"></script>
<script src="mrp/mrp-data.js"></script>
<script type="text/babel" src="pos/tweaks-panel.jsx"></script>
<script type="text/babel" src="mrp/mrp-parts.jsx"></script>
<script type="text/babel" src="mrp/mrp-floor.jsx"></script>
<script type="text/babel">
/* The operator device. Same component the module embeds — here it owns the screen. */
const FLOOR_TWEAKS = /*EDITMODE-BEGIN*/{
  "lang": "fr",
  "device": "desktop"
}/*EDITMODE-END*/;

function FloorApp() {
  const [t, setTweak] = useTweaks(FLOOR_TWEAKS);
  window.MR_LANG = t.lang;
  return (
    <div className={'stage ' + (t.device === 'phone' ? 'phone' : t.device === 'tablet' ? 'tablet' : 'full')}>
      <div className="rt-wrap">
        <div className="rt" style={{ gridTemplateColumns: '1fr' }}>
          <FloorView standalone />
          <TweaksPanel>
            <TweakSection label="Operator device" />
            <TweakRadio label="Language" value={t.lang}
              options={[{ value: 'fr', label: 'FR' }, { value: 'en', label: 'EN' }]}
              onChange={(v) => setTweak('lang', v)} />
            <TweakRadio label="Device" value={t.device}
              options={[{ value: 'phone', label: 'Phone' }, { value: 'tablet', label: 'Tablet' }, { value: 'desktop', label: 'Full' }]}
              onChange={(v) => setTweak('device', v)} />
          </TweaksPanel>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<FloorApp />);
</script>
</body>
</html>
